name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run mandatory tests that do not require a live deployment
        env:
          AGENT_API_KEY: ci-test-key
          REDIS_URL: fake://
        run: >-
          pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py
          tests/test_cp4.py -v -m "not docker"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t day12-agent:${{ github.sha }} .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy main after quality gates
        run: npx --yes @railway/cli up --ci
